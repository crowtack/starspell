services:
  postgres:
    image: postgres:16-alpine
    container_name: starspell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starspell
      POSTGRES_PASSWORD: starspell
      POSTGRES_DB: starspell
    ports:
      - '5432:5432'
    volumes:
      - starspell_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starspell -d starspell']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  starspell_pgdata:
